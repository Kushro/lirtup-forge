[package]
name = "lirtup-magpiefx"
description = "MagpieFX effect loader: parser, expressions, codegen, HLSL compiler, DDS and runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
xxhash-rust.workspace = true
image.workspace = true
lirtup-config.workspace = true
lirtup-gpu.workspace = true
lirtup-effects.workspace = true
regex.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
tempfile.workspace = true

[dev-dependencies]
# The hand ports of the retired native engine, to compare with the same
# effects run through MagpieFX (`tests/ports.rs`, fx-unify).
lirtup-effects = { workspace = true, features = ["ports"] }

[[bin]]
name = "magpiefx-seed"
path = "src/bin/magpiefx-seed.rs"

[lints]
workspace = true
