[package]
name = "lirtup-ui"
description = "lirtup-gui: the Dioxus Desktop GUI of LirtUp Forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The reviewer owns this file (round 3): fronts ask for dependencies in
# their note.
[dependencies]
dioxus = { workspace = true, features = ["desktop"] }
lirtup-config.workspace = true
lirtup-proto.workspace = true
lirtup-x11.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
indexmap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# i18n (i18n.rs)
fluent-templates.workspace = true
# Theme from the seed color (theme.rs, front A)
material-colors.workspace = true
# Thumbnails (thumbs.rs, front B)
image.workspace = true
# Desktop notifications (notify.rs, round 4 front Y)
notify-rust.workspace = true

[lints]
workspace = true

[[bin]]
name = "lirtup-gui"
path = "src/main.rs"
