# Shape of a real 1.3 config.yaml (written by the 1.x GUI): MagpieFX chain in
# the long form, a few top-level options and profiles that only store what
# differs, with hotkeys diffed against the defaults.
effects_engine: magpiefx
magpie_effects:
- name: Anime4K_Upscale_Denoise_UL
  params: {}
- name: Anime4K_Restore_Soft_UL
  params: {}
- name: Lanczos
  params: {}
auto_crop_menu_bar: true
show_stats: true
frame_gen_multiplier: 4
profiles:
  Juego:
    match:
      title_contains: Genshin
      width: '>=1280'
    options:
      model: 4x24
      output_geometry: cover
      background_color: '#202020'
      hotkeys:
        zoom_in: Ctrl+Alt+Plus
  Video:
    match:
      title_regex: (mpv|VLC)
    options:
      effects_engine: native
      model: fast
      cas_enabled: true
      cas_strength: 0.6
      daemon_exclude: true
  Manual:
    options:
      model: 8x32
      double_upscale: true
      frame_gen_engine: native
