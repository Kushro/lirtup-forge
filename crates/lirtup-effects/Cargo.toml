[package]
name = "lirtup-effects"
description = "SRCNN (CuNNy), native scalers and effects, converters and OSD for LirtUp Forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
lirtup-config.workspace = true
lirtup-gpu.workspace = true
ab_glyph.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# The hand ports of Anime4K_Upscale_S, LumaSharpen and CRT_Easymode (the
# retired native effects engine), kept only as parity references for the
# tests: never in the app (fx-unify). The self dev-dependency below turns it
# on for this crate's tests, so `cargo test --workspace` builds them.
ports = []

[lints]
workspace = true

[dev-dependencies]
image.workspace = true
lirtup-effects = { path = ".", features = ["ports"] }
