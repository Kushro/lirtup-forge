[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-rt-upscaler"
version = "1.1.4"
description = "LirtUp Forge: a real-time SRCNN upscaler for any X-Window (fork of linux-rt-upscaler)."
readme = "README.md"
authors = [
    { name = "Mauricio Valentín Barón Salinas", email = "baronsmv@gmail.com" }
]
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
keywords = [
    "srcnn",
    "upscaling",
    "cunny",
    "super-resolution",
    "neural-network",
    "linux",
    "x11",
    "vulkan",
]
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "pyside6",
    "pyyaml",
    "shiboken6",
    "xcffib",
]

[project.urls]
Homepage = "https://github.com/Kushro/lirtup-forge"
Repository = "https://github.com/Kushro/lirtup-forge.git"
BugTracker = "https://github.com/Kushro/lirtup-forge/issues"
Upstream = "https://github.com/baronsmv/linux-rt-upscaler"

[project.scripts]
upscale = "upscaler.cli:main"
upscale-gui = "upscaler.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"upscaler.capture" = ["lib/*.c", "lib/*.h"]
"upscaler.gui.icons" = ["*.svg", "**/*.svg"]
"upscaler.gui" = ["locale/*.qm"]
"upscaler.magpiefx" = [
    "effects/**/*.hlsl",
    "effects/**/*.hlsli",
    "effects/*.md",
    "effects/LICENSE-Magpie",
    "internal/*.hlsl",
]
"upscaler.shaders" = ["**/*.spv"]
"upscaler.srcnn" = ["**/*.json", "**/*.spv"]
"upscaler.vulkan" = ["lib/*.cpp", "lib/*.h"]
