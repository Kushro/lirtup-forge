docs_dir: docs
site_name: LirtUp Forge
repo_url: https://github.com/Kushro/lirtup-forge
repo_name: Kushro/lirtup-forge
site_description: LirtUp Forge, a real-time SRCNN upscaler for X11 windows (fork of linux-rt-upscaler).
site_author: Luis Coronado
theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - User Guide:
      - Installation: user/installation.md
      - Migrating from 1.x: user/migration.md
      - Graphical Interface: user/gui.md
      - Scaling Modes: user/modes.md
      - Controls: user/controls.md
      - Tray and Daemon: user/tray-daemon.md
      - Command Line: user/cli.md
      - Configuration: user/configuration.md
      - MagpieFX Effects: user/magpiefx.md
      - Troubleshooting: user/troubleshooting.md
  - Developer:
      - Overview: developer/overview.md
      - Rust Rewrite: developer/rust-refactor-analysis.md
      - MagpieFX Report: developer/magpiefx-report.md
      - Frame Generation Analysis: developer/frame-generation-analysis.md
      - Architecture:
          - Architecture Limitations: developer/architecture/limitations.md
